services:
  circuitmind:
    build: .
    image: circuitmind
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file:
      - path: .env
        required: false
    environment:
      # настройки провайдеров, зашифрованные ключи и сохранённые проекты живут в томе
      CIRCUITMIND_DATA_DIR: /data
      # приложение за собственной авторизацией/прокси? тогда разрешите страницу «Модели» не только с localhost:
      # CIRCUITMIND_ALLOW_REMOTE_SETTINGS: '1'
    volumes:
      - circuitmind-data:/data

volumes:
  circuitmind-data:
